name: Documentation Check

on:
  push:
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-check.yml"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown files are non-empty
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -name "*.md" -not -path "./.git/*")
          test -n "$files"
          while IFS= read -r file; do
            test -s "$file"
          done <<< "$files"
